name: SBOM & Checksums

# On a Release published by a human, attach a CycloneDX SBOM and SHA-256
# checksums as release assets. NOTE: release-please's own releases are created
# with GITHUB_TOKEN and therefore do NOT trigger `on: release` workflows — the
# automated path attaches its own SBOM + checksums inside release-please.yml's
# publish job. This workflow only covers manually published Releases and is a
# candidate for removal.

on:
  release:
    types: [published]

permissions:
  contents: write # attach assets to the release that triggered this run

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate checksums
        run: (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install .
          cyclonedx-py environment -o sbom.cdx.json
          echo "wrote sbom.cdx.json"

      - name: Attach SBOM + checksums to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SHA256SUMS
            sbom.cdx.json
