name: MCPscan (code scanning)

# Dogfood: run mcpscan against its own checkout and upload SARIF to GitHub
# code scanning. Findings remain advisory for merge gating, but a non-zero scan
# result is made explicit in the job summary and listener attribution is retained
# as evidence for exposure triage.
#
# Guarded to public repositories because SARIF upload requires GitHub Advanced
# Security (free on public repos; a paid add-on on private ones).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: scan & upload SARIF
    runs-on: ubuntu-latest
    if: github.event.repository.visibility == 'public'
    permissions:
      contents: read
      security-events: write # required to upload SARIF to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install mcpscan (from source)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Capture listener attribution
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Listener attribution"
            echo "# Captured for security triage only: bind address, process name, PID, and socket metadata."
            echo "# No process environment or secret material is collected."
            echo
            if command -v ss >/dev/null 2>&1; then
              sudo ss -H -lntp || ss -H -lntp || true
            else
              echo "ss unavailable"
            fi

            if command -v lsof >/dev/null 2>&1; then
              echo
              echo "# lsof fallback / cross-check"
              sudo lsof -nP -iTCP -sTCP:LISTEN || lsof -nP -iTCP -sTCP:LISTEN || true
            fi

            if command -v systemctl >/dev/null 2>&1; then
              echo
              echo "# systemd socket-unit mapping"
              echo "# LISTEN UNIT ACTIVATES"
              sudo systemctl list-sockets --all --no-pager --no-legend 2>/dev/null \
                || systemctl list-sockets --all --no-pager --no-legend 2>/dev/null \
                || true
            fi
          } | tee listener-attribution.txt

      - name: Scan and emit SARIF
        id: mcpscan
        # Advisory by design: retain the scanner's real exit outcome while
        # allowing SARIF and evidence uploads to complete.
        continue-on-error: true
        run: mcpscan scan --sarif results.sarif --fail-on critical

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: mcpscan

      - name: Upload MCPscan triage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpscan-triage-evidence
          path: |
            listener-attribution.txt
            results.sarif
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize MCPscan advisory result
        if: always()
        shell: bash
        env:
          MCPSCAN_OUTCOME: ${{ steps.mcpscan.outcome }}
        run: |
          {
            echo "## MCPscan advisory result"
            echo
            if [[ "$MCPSCAN_OUTCOME" == "failure" ]]; then
              echo "- Scan outcome: **advisory findings triggered the configured fail threshold**."
              echo "- The job is intentionally allowed to continue so SARIF and triage evidence are preserved."
              echo "- A green workflow therefore does **not** mean MCPscan reported no findings."
            elif [[ "$MCPSCAN_OUTCOME" == "success" ]]; then
              echo "- Scan outcome: **no finding triggered the configured critical threshold**."
            else
              echo "- Scan outcome: **$MCPSCAN_OUTCOME**."
              echo "- Review the job log before treating this run as clean."
            fi

            echo "- Listener evidence records bind address plus available PID/process attribution only; it does not establish MCP identity or Internet reachability."

            if [[ -s listener-attribution.txt ]]; then
              port22="$(grep -E ':22([[:space:]]|$)' listener-attribution.txt || true)"
              if [[ -n "$port22" ]]; then
                echo
                echo "### Port 22 listener evidence"
                echo '~~~text'
                printf '%s\n' "$port22"
                echo '~~~'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
