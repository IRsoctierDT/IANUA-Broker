name: release-please

# Automated releases from Conventional Commits (Phase 3).
#
# On each push to main, release-please maintains a "release PR" that bumps the
# version in pyproject.toml and updates CHANGELOG.md. Merging that PR tags the
# release and creates a GitHub Release; the publish job then builds and pushes to
# PyPI via Trusted Publishing (OIDC — no stored token), gated on the `pypi`
# environment. This is the sole publish path (there is no manual release.yml).
#
# Operator step: on PyPI, add a Trusted Publisher for THIS workflow filename
# (release-please.yml) + environment `pypi`, scoped to the `ianua-broker`
# project. See docs/DEVSECOPS.md.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Manifest mode (no explicit root component) exposes the "any release
      # created" flag as `releases_created` — NOT the top-level `release_created`,
      # which stays empty here. release-please-action v4 backfilled that name, so
      # #60's v4->v5 bump silently made the old `release_created` gate skip every
      # publish (1.4.1, 1.5.0 were tagged but never reached PyPI). Gate on
      # `releases_created`. The tag is derived in the publish job (below) rather
      # than read from an output, because the per-path tag output is empty here
      # too — deriving <package-name>-v<version> is version-proof.
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC Trusted Publishing
      contents: write # attach SBOM + checksums to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: tag
        # Reconstruct release-please's tag (<package-name>-v<version>) from the
        # config + the just-released pyproject version, rather than a fragile
        # action output. include-v-in-tag is true, so the tag is e.g.
        # ianua-broker-v1.0.0.
        run: |
          PKG=$(python -c "import json; print(json.load(open('release-please-config.json'))['packages']['.']['package-name'])")
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=${PKG}-v${VER}" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install cyclonedx-bom
          python -m pip install .
          cyclonedx-py environment -o sbom.cdx.json

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach SBOM + checksums to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            SHA256SUMS
            sbom.cdx.json
