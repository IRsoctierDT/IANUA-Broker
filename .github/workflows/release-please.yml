name: release-please

# Automated releases from Conventional Commits (Phase 3).
#
# On each push to main, release-please maintains a "release PR" that bumps the
# version in pyproject.toml and updates CHANGELOG.md. Merging that PR tags the
# release and creates a GitHub Release; the publish job then builds and pushes to
# PyPI via Trusted Publishing (OIDC — no stored token), gated on the `pypi`
# environment. This is the sole publish path (there is no manual release.yml).
#
# Versioning is automated: never hand-edit pyproject version or invent a
# CHANGELOG section for an unreleased version — land Conventional Commits
# (`feat:` / `fix:` / `feat!:`) on main; merge the release-please PR to ship.
#
# Operator step: on PyPI, add a Trusted Publisher for THIS workflow filename
# (release-please.yml) + environment `pypi`, scoped to the `ianua-broker`
# project. See docs/DEVSECOPS.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # One release-please run at a time, repository-wide. A release-PR merge
    # followed closely by another push used to run this job twice at once:
    # both runs saw the merged PR as pending, both tried to create the same
    # release, and one failed with `already_exists` (1.11.4). The group is
    # fixed rather than per-ref because release-please always acts on the
    # default branch, whatever ref triggered the run. It is job-level so a
    # publish waiting on `pypi` approval never holds up the next run. Never
    # cancel in progress: a run cut short mid-release can leave a tag with no
    # publish.
    concurrency:
      group: release-please
      cancel-in-progress: false
    outputs:
      # Manifest mode (no explicit root component) exposes the "any release
      # created" flag as `releases_created` — NOT the top-level `release_created`,
      # which stays empty here. release-please-action v4 backfilled that name, so
      # #60's v4->v5 bump silently made the old `release_created` gate skip every
      # publish (1.4.1, 1.5.0 were tagged but never reached PyPI). Gate on
      # `releases_created`. The tag is derived in the publish job (below) rather
      # than read from an output, because the per-path tag output is empty here
      # too — deriving <package-name>-v<version> is version-proof.
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC Trusted Publishing
      contents: write # attach SBOM + checksums to the release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes; keep the token from build code
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: tag
        # Reconstruct release-please's tag (<package-name>-v<version>) from the
        # config + the just-released pyproject version, rather than a fragile
        # action output. include-v-in-tag is true, so the tag is e.g.
        # ianua-broker-v1.0.0.
        run: |
          PKG=$(python -c "import json; print(json.load(open('release-please-config.json'))['packages']['.']['package-name'])")
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "name=${PKG}-v${VER}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Check out the tagged release
        # Build the commit the release tag points at, not the commit that
        # triggered this run. They differ whenever the run creating the release
        # is not the release commit's own: a concurrent push, a newer run that
        # replaced a pending one, or a retry after that run failed. 1.11.4 was
        # built that way from the commit after its tag, so its sdist carries a
        # file the tag does not have. Full history, so the tag can be checked
        # against main below.
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag before building it
        # Fail closed unless the tagged tree declares the version the tag names
        # (the version-vs-tag guard docs/DEVSECOPS.md describes) and the tag
        # sits on main's history, so a tag pushed onto any other commit can
        # never reach PyPI.
        env:
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          TREE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TREE_VERSION" != "$VERSION" ]; then
            echo "::error::$TAG declares version $TREE_VERSION, not $VERSION; refusing to publish"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse HEAD)) is not on main; refusing to publish"
            exit 1
          fi
          echo "Publishing $TAG from $(git rev-parse HEAD)"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate checksums
        run: sha256sum dist/* > SHA256SUMS

      - name: Generate CycloneDX SBOM
        # Describe what a user installs, not this job. Scanning the job's own
        # environment listed 37 build and SBOM tools beside the 2 packages a
        # user installs (1.11.5), with no subject. Instead, install the built
        # wheel into an otherwise empty environment (no pip: the job's pip
        # installs into it) and make the package the SBOM's subject. Pinned:
        # how --pyproject turns the installed package into the subject was
        # verified on this version, and a release is no time to find out.
        run: |
          python -m pip install cyclonedx-bom==7.5.0
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install dist/*.whl
          cyclonedx-py environment --pyproject pyproject.toml -o sbom.cdx.json "$RUNNER_TEMP/sbom-env/bin/python"

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Attach SBOM + checksums to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            SHA256SUMS
            sbom.cdx.json
